[project]
name = "transit-backend"
version = "0.1.0"
description = "Intelligent College Transport Platform - FastAPI modular monolith"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "tzdata>=2024.1",  # zoneinfo data on Windows
    "httpx>=0.27",  # reports agent -> local Ollama
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["app*"]
