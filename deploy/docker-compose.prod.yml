# Production stack on one VM: Postgres, the API (one worker) and Caddy (HTTPS, web app, API proxy).
#
#   cd deploy && cp .env.prod.example .env      # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile ai up -d    # also run Ollama for the report agent
#
# Build the Flutter web app into frontend/build/web first. Full steps: docs/DEPLOY.md.
name: transit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: transit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the API reaches the database.

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://transit:${POSTGRES_PASSWORD}@db:5432/transit
      CORS_ORIGINS: https://${WEB_DOMAIN:?set WEB_DOMAIN in deploy/.env}
      OLLAMA_URL: http://ollama:11434
    # Never scale this service (see the note in backend/Dockerfile).

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/build/web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama:
